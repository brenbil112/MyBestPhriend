<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDI.fyi | Drug Interaction Intelligence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
      <div class="brand-lockup">
        <span class="brand-mark">DDI</span><span class="brand-domain">.fyi</span>
      </div>
      <p>Drug Interaction Assistant</p>
    </header>
  
    <nav class="main-nav">
      <ul>
        <li><a href="index.html" aria-current="page">DDI.fyi</a></li>
        <li><a href="pages/ResourceLinks.html">Resources</a></li>
      </ul>
    </nav>
  
    <main class="content assistant-content">
      <div id="container" class="assistant-panel">
        <p class="eyebrow">Fast lookup</p>
        <h2>Drug Interaction Assistant</h2>
        <p class="panel-intro">Enter one or more medications to find matching ClinicalKey identifiers.</p>
        <textarea id="input-box" placeholder="Copy + paste or enter drug list here..."></textarea>
        <button id="submit-button">Submit</button>
        <ul id="match-list"></ul>
        <a id="clinical-key-link" href="#">Click here to open a new tab with drug interactions report</a>
      </div>

    </main>
  
    <footer class="site-footer">
      <p>&copy; 2026 DDI.fyi <span>For informational and educational use.</span></p>
